# domain_profile.yaml — advisory agentic-research controls for HERACLES.
# Validation inputs only; they do not execute autonomous agents.
name: no_time_to_die
codename: HERACLES
film: "No Time to Die (2021)"

review_gates:
  - pytest_cov_90
  - ruff_check_format
  - mypy_src_scripts
  - lineage_zero
  - zero_mocks

source_policy:
  numeric_claims: data/claim_ledger.yaml
  procedural_math:
    - "Pure deterministic functions in src/no_time_to_die; verified by tests"
  synthetic_inputs:
    - "Demo reference genome, guide set, and spectral fingerprints are synthetic calibrants documented in claim_ledger"

artifact_expectations:
  figures:
    - output/figures/delivery_kinetics.png
    - output/figures/toxicology_dose_response.png
    - output/figures/guide_efficiency.png
    - output/figures/antidote_response.png
    - output/figures/detection_confidence.png
  data:
    - output/data/manuscript_variables.json
  manuscripts:
    - output/manuscript/*.md

benchmark_rubric:
  coverage_floor_pct: 90.0
  max_failures: 0
  deterministic: true
