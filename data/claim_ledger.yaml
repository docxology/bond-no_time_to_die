# claim_ledger.yaml — sourced numeric claims for HERACLES.
# Every numeric constant used in the demonstration is registered here so the
# evidence-registry validation can trace it to a source. LD50 figures are
# standard published approximations for mammalian/human exposure (ranges span
# published references); the forensic spectra and demo genome are synthetic
# calibrants/inputs, explicitly not measured data.
version: 1.0.0

claims:
  - id: ld50_ricin
    value_mg_per_kg: 1.0
    source: "Published approximation, ricin (Ricinus communis) oral/mammalian toxicity"
    note: "Standard cited order-of-magnitude; synthetic-domain calibrant for Hill model"
  - id: ld50_atropine
    value_mg_per_kg: 10.0
    source: "Published approximation, atropine (Atropa belladonna) toxicity"
  - id: ld50_coniine
    value_mg_per_kg: 6.0
    source: "Published approximation, coniine (Conium maculatum) toxicity"
  - id: ld50_aconitine
    value_mg_per_kg: 1.5
    source: "Published approximation, aconitine (Aconitum napellus) toxicity"
  - id: ld50_strychnine
    value_mg_per_kg: 2.0
    source: "Published approximation, strychnine (Strychnos nux-vomica) toxicity"
  - id: ld50_nicotine
    value_mg_per_kg: 0.8
    source: "Published approximation, nicotine (Nicotiana tabacum) toxicity"
  - id: ld50_cyanide
    value_mg_per_kg: 1.5
    source: "Published approximation, cyanogenic prussic acid toxicity"
  - id: demo_seed
    value: 11
    source: "Fixed deterministic seed (src/no_time_to_die/demo.py)"
    synthetic: true
  - id: lod_snr
    value: 3.0
    source: "Conventional limit-of-detection signal-to-noise threshold"
  - id: forensic_spectra
    value: "synthetic non-negative 5-bin fingerprints"
    source: "Synthetic calibrants in src/no_time_to_die/delivery_forensics.py"
    synthetic: true
  - id: demo_reference_genome
    value: "periodic 64-nt ACGT string"
    source: "Synthetic deterministic input (src/no_time_to_die/demo.py)"
    synthetic: true
  - id: guide_design_params
    value: "ideal GC 0.5, GC penalty 1.0, homopolymer penalty 0.05, mismatch decay 0.5"
    source: "Model parameters (src/no_time_to_die/targeting_design.py), Doench-style (Doench 2014)"
    synthetic: true
  - id: ki_naloxone
    value_mg_per_l: 0.4
    source: "Published approximation, naloxone Ki (antidote library)"
  - id: ki_flumazenil
    value_mg_per_l: 1.0
    source: "Published approximation, flumazenil Ki"
  - id: ki_pralidoxime
    value_mg_per_l: 2.0
    source: "Published approximation, pralidoxime Ki"
  - id: ki_acetylcysteine
    value_mg_per_l: 0.8
    source: "Published approximation, acetylcysteine Ki"
  - id: ki_vitamin_k
    value_mg_per_l: 5.0
    source: "Published approximation, vitamin K Ki"
  - id: exposure_scenario
    value: "conc 0.02, rate 0.5, duration 30, absorbed frac 0.2, elim 0.1, NOAEL 0.5, RfD 0.001"
    source: "Synthetic deterministic exposure scenario (src/no_time_to_die/demo.py)"
    synthetic: true
