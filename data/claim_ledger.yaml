    units: nucleotides
    synthetic: true
    source: "Synthetic 144-nt reference: 2 exact on-target windows, 3 declared near-misses, 4 fillers"
    note: >-
      Replaced the periodic "AACCGGTTAACCGGTT" * 4 reference on 2026-08-05. The
      old one forced 100% specificity and zero off-target risk by construction;
      this one plants a known structure so the result is measured, not assumed.
  - id: demo_candidates
    value: ["AACCGGTTAACCGGTT", "AACCGGTTAACCGGTC", "TTGGCCAATTGGCCAA", "AAAAAAAAAAAAAAAA"]
