  # --- Antidote library (src/no_time_to_die/antidote_screening.py) -----------
  # WITHDRAWN CLAIM. Ledger v1.0.0 labelled all five of these "Published
  # approximation, <drug> Ki" and left them unflagged, i.e. on the
  # measured-approximation side of this file's own distinction. That was
  # fabricated provenance: no publication reports these numbers. Naloxone and
  # flumazenil bind at nanomolar affinity, which 0.4 and 1.0 mg/L are not in any
  # unit system; and pralidoxime (an AChE reactivator), acetylcysteine (a
  # glutathione precursor), and vitamin K (a clotting-factor cofactor) are not
  # competitive receptor antagonists and have no Ki of this kind at all. The
  # values are invented spreads that make the screen legible.
  - id: ki_naloxone
    value: 0.4
    units: mg/L
    synthetic: true
    source: "Invented inhibition constant; named after a real opioid antagonist"
  - id: ki_flumazenil
    value: 1.0
    units: mg/L
    synthetic: true
    source: "Invented inhibition constant; named after a real benzodiazepine antagonist"
  - id: ki_pralidoxime
    value: 2.0
    units: mg/L
    synthetic: true
    source: "Invented inhibition constant; the real drug is a reactivator, not an antagonist"
  - id: ki_acetylcysteine
    value: 0.8
    units: mg/L
    synthetic: true
    source: "Invented inhibition constant; the real drug is a glutathione precursor"
  - id: ki_vitamin_k
    value: 5.0
    units: mg/L
    synthetic: true
    source: "Invented inhibition constant; the real vitamin is an enzymatic cofactor"

