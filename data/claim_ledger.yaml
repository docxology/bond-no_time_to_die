# claim_ledger.yaml — the numeric-constant registry for HERACLES.
#
# WHAT THIS FILE GUARANTEES (and what it does not)
#
# Guaranteed, and enforced by `tests/test_claim_ledger.py`: every numeric or
# sequence constant that the demonstration consumes appears here exactly once,
# with its live value, and the ledger contains no entry that no longer exists in
# the code. The test derives the expected id set from the modules themselves, so
# adding a toxin, a demo parameter, or a library entry without registering it
# fails the build, and editing a value here without editing the code fails too.
# Before 2026-08-05 the header made this claim with nothing enforcing it, and 20+
# constants (every Hill coefficient, every demo scalar, the whole forensic
# calibration) were in fact unregistered.
#
# NOT guaranteed: that a `synthetic: false` value is traceable to a specific
# citation. The `source` field is a provenance *label*, not a reference. Only two
# provenance classes exist here:
#
#   synthetic: true   — invented for this demonstration. No measurement claim.
#   synthetic: false  — a commonly-cited order-of-magnitude figure for a real
#                       substance, recorded without a specific citation, and used
#                       as a plausible calibrant rather than as data.
#
# Nothing in this package is a measurement. See manuscript/07_scope_and_related_work.md.
version: 2.0.0

claims:
  # --- Poison-garden catalog (src/no_time_to_die/toxicology.py) --------------
  # LD50s are commonly-cited order-of-magnitude figures for real substances.
  # The Hill slopes beside them are NOT: no source reports these coefficients,
  # they are shape parameters chosen to give the catalog distinguishable curves.
  - id: ld50_ricin
    value: 1.0
    units: mg/kg
    synthetic: false
    source: "Commonly-cited order-of-magnitude figure, ricin (Ricinus communis)"
  - id: hill_ricin
    value: 2.0
    units: dimensionless
    synthetic: true
    source: "Curve-shape parameter chosen for this demonstration"
  - id: ld50_atropine
    value: 10.0
    units: mg/kg
    synthetic: false
    source: "Commonly-cited order-of-magnitude figure, atropine (Atropa belladonna)"
  - id: hill_atropine
    value: 1.5
    units: dimensionless
    synthetic: true
    source: "Curve-shape parameter chosen for this demonstration"
  - id: ld50_coniine
    value: 6.0
    units: mg/kg
    synthetic: false
    source: "Commonly-cited order-of-magnitude figure, coniine (Conium maculatum)"
  - id: hill_coniine
    value: 1.2
    units: dimensionless
    synthetic: true
    source: "Curve-shape parameter chosen for this demonstration"
  - id: ld50_aconitine
    value: 1.5
    units: mg/kg
    synthetic: false
    source: "Commonly-cited order-of-magnitude figure, aconitine (Aconitum napellus)"
  - id: hill_aconitine
