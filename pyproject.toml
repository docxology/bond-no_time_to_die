[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "no_time_to_die"
version = "1.0.0"
license = {text = "MIT"}
description = "HERACLES — special-agent mission software: DNA-targeted bioweapon countermeasure, poison-garden toxicology, and poison delivery forensics (No Time to Die, 2021)."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
    "bond-utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0.12",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

# bond-api is the FROZEN mission protocol (Layer 1); bond-utilities is the
# Layer 0 provenance/utility foundation the mission record persistence uses.
# Both are sibling trees — relative so the package can be synced from a
# relocated clone (never an absolute machine path).
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }
bond-utilities = { path = "vendor/bond-utilities" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.mypy]
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
