# experiment_plan.yaml — HERACLES mission experiment plan.
mission: no_time_to_die
codename: HERACLES

conditions:
  - name: countermeasure_specificity
    objective: select most specific DNA guide and bound neutralization probability
    primary_metric: specificity (share of hits on-target)
    inputs: demo.py reference + guide set, max_mismatches=2, avidity=3.0
  - name: toxicology_catalog
    objective: profile poison-garden flora as Hill hazards
    primary_metric: median LD50 over catalog (mg/kg)
    inputs: TOXIN_CATALOG (7 toxins)
  - name: vesper_trace_detection
    objective: detect and identify a delivered poison residue
    primary_metric: recovered dose from calibration + top spectral match
    inputs: signal=9.0, noise=1.0, LOD SNR=3.0, calibration slope=2.0
  - name: guide_design
    objective: rank countermeasure guides by efficiency weighted by population off-target
    primary_metric: best guide efficiency score
    inputs: 4 candidates vs demo reference genome, max_mismatches=2
  - name: antidote_screening
    objective: rank competitive antagonists by restored survival vs a toxin dose
    primary_metric: best survival probability
    inputs: ricin dose 0.5, antagonist conc 10.0, 5-antidote library
  - name: exposure_assessment
    objective: assess a poison exposure pathway's absorbed dose and risk
    primary_metric: margin of exposure + risk quotient
    inputs: demo exposure scenario (conc, rate, duration, elim, NOAEL, RfD)

figure_expectations:
  - toxicology_dose_response.png
  - delivery_kinetics.png
  - guide_efficiency.png
  - antidote_response.png
  - detection_confidence.png

table_expectations:
  - Three conditions in manuscript/05_experimental_setup.md

baseline:
  - "Deterministic seed = 11, canonical demo.py, no random draws"

ablation:
  - "Specificity=0 (no on-target) drives neutralization probability to 0"
  - "Sub-LOD signal clamps recovered concentration to 0 (no false positive)"
